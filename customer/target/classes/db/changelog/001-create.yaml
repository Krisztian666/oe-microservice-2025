databaseChangeLog:
  - changeSet:
      id: 001-customer-create
      author: Krisztian Karoczkai
      labels: Vevők táblák létrehozása
      context: public
      comment: Vevők szerkezete
      changes:
        - createTable:
            schemaName: public
            tableName: customer
            columns:
              - column:
                  name: id
                  type: uuid
##                  defaultValueComputed: uuid_generate_v4 ()
                  remarks: Egyedi azonosító
                  constraints:
                    primaryKey: true
                    primaryKeyName: TRANSACTION_ID
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  remarks: Vevő rövid neve neve
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  remarks: Vevő leírás
                  constraints:
                    nullable: true
